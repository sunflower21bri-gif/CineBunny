<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBunny Forum - Reseñas de Películas y Libros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Announcement Bar -->
  <header class="header-container">
    <div class="logo-area">
      <!-- Bunny Avatar Illustration based on reference photo -->
      <div class="bunny-avatar-wrapper">
        <svg class="bunny-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
          <!-- Background Glow Soft Pastel -->
          <circle cx="100" cy="110" r="90" fill="#EAE6F8"/>
          <!-- Left Ear -->
          <ellipse cx="65" cy="55" rx="18" ry="48" fill="#FFFFFF" transform="rotate(-12 65 55)"/>
          <ellipse cx="65" cy="55" rx="9" ry="34" fill="#FCEBEF" transform="rotate(-12 65 55)"/>
          <!-- Right Ear -->
          <ellipse cx="135" cy="55" rx="18" ry="48" fill="#FFFFFF" transform="rotate(12 135 55)"/>
          <ellipse cx="135" cy="55" rx="9" ry="34" fill="#FCEBEF" transform="rotate(12 135 55)"/>
          <!-- Head -->
          <ellipse cx="100" cy="125" rx="52" ry="48" fill="#FFFFFF"/>
          <path d="M 68 150 C 60 165, 140 165, 132 150 Z" fill="#FFFFFF"/>
          <!-- Cheeks -->
          <circle cx="72" cy="132" r="9" fill="#F8D7DC" opacity="0.6"/>
          <circle cx="128" cy="132" r="9" fill="#F8D7DC" opacity="0.6"/>
          <!-- Nose & Mouth -->
          <polygon points="96,126 104,126 100,131" fill="#EAA4B4"/>
          <path d="M 96 133 Q 100 137 104 133" stroke="#B29DB0" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- Orange Glasses -->
          <rect x="52" y="105" width="42" height="24" rx="6" fill="none" stroke="#E6A885" stroke-width="6"/>
          <rect x="106" y="105" width="42" height="24" rx="6" fill="none" stroke="#E6A885" stroke-width="6"/>
          <line x1="94" y1="112" x2="106" y2="112" stroke="#E6A885" stroke-width="5"/>
          <rect x="55" y="108" width="36" height="18" rx="4" fill="#3D343E" opacity="0.65"/>
          <rect x="109" y="108" width="36" height="18" rx="4" fill="#3D343E" opacity="0.65"/>
          <!-- Glass Reflections -->
          <path d="M 58 110 L 72 110 L 62 122 Z" fill="#FFFFFF" opacity="0.3"/>
          <path d="M 112 110 L 126 110 L 116 122 Z" fill="#FFFFFF" opacity="0.3"/>
          <!-- Blue Bowtie -->
          <g transform="translate(100, 162)">
            <polygon points="-2"0 -22,-8 -20,8" fill="#7FA3D1"/>
            <polygon points="2,0 22,-8 20,8" fill="#7FA3D1"/>
            <circle cx="0" cy="0" r="4.5" fill="#5C82B6"/>
          </g>
        </svg>
      </div>
      <div>
        <h1 class="app-title">CineBunny Forum</h1>
        <p class="app-subtitle">Tu comunidad suave de películas, libros y novelas favoritas 🍿📚</p>
      </div>
    </div>

    <div class="actions-top">
      <button id="btn-download-zip" class="btn-zip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Descargar Archivos (ZIP)
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-layout">
    
    <!-- Left Column: Form Panel -->
    <aside class="side-panel">
      <div class="card-box">
        <div class="card-header-cute">
          <h2>✨ Nueva Publicación</h2>
          <p>Comparte tu reseña con la comunidad Bunny</p>
        </div>

        <form id="review-form">
          <div class="form-group">
            <label for="media-type">Categoría</label>
            <select id="media-type" class="custom-input">
              <option value="Pelicula">🎬 Película</option>
              <option value="Libro">📖 Libro</option>
              <option value="Novela">🌌 Novela / Manga</option>
            </select>
          </div>

          <div class="form-group">
            <label for="title">Título del Trabajo</label>
            <input type="text" id="title" class="custom-input" placeholder="Ej: Spider-Man, Orgullo y Prejuicio..." required>
          </div>

          <div class="form-group">
            <label for="creator">Director / Autor(a)</label>
            <input type="text" id="creator" class="custom-input" placeholder="Ej: Christopher Nolan, Jane Austen..." required>
          </div>

          <div class="form-group">
            <label for="author">Tu Apodo / Usuario</label>
            <input type="text" id="author" class="custom-input" placeholder="Ej: BunnyLover99" required>
          </div>

          <!-- Cover Image Option -->
          <div class="form-group">
            <label>Imagen de Portada</label>
            <div class="tab-selectors">
              <button type="button" class="tab-btn active" id="tab-file-btn" onclick="switchImageTab('file')">📁 Archivo</button>
              <button type="button" class="tab-btn" id="tab-url-btn" onclick="switchImageTab('url')">🔗 URL Web</button>
            </div>

            <div id="file-tab-content" class="tab-panel active">
              <input type="file" id="cover-file" accept="image/*" class="custom-input-file">
            </div>

            <div id="url-tab-content" class="tab-panel">
              <input type="url" id="cover-url" class="custom-input" placeholder="https://ejemplo.com/portada.jpg">
            </div>

            <div id="preview-box" class="preview-box hidden">
              <img id="preview-img" src="" alt="Previsualización">
            </div>
          </div>

          <!-- Star Rating -->
          <div class="form-group">
            <label>Calificación</label>
            <div class="stars-picker" id="stars-picker">
              <span class="star-btn" data-value="1">★</span>
              <span class="star-btn" data-value="2">★</span>
              <span class="star-btn" data-value="3">★</span>
              <span class="star-btn" data-value="4">★</span>
              <span class="star-btn" data-value="5">★</span>
            </div>
            <input type="hidden" id="rating-val" value="5">
          </div>

          <!-- Comment -->
          <div class="form-group">
            <label for="comment">Tu Reseña / Opinión</label>
            <textarea id="comment" rows="3" class="custom-input custom-textarea" placeholder="¿Qué te pareció? Cuéntanos los detalles..." required></textarea>
          </div>

          <button type="submit" class="btn-submit">Publicar en el Foro 🐰</button>
        </form>
      </div>
    </aside>

    <!-- Right Column: Forum Stream -->
    <section class="content-panel">
      
      <!-- Filter and Controls Bar -->
      <div class="filters-card">
        <div class="category-tabs">
          <button class="cat-btn active" onclick="setCategoryFilter('all')">Todos (<span id="count-all">0</span>)</button>
          <button class="cat-btn" onclick="setCategoryFilter('Pelicula')">🎬 Películas</button>
          <button class="cat-btn" onclick="setCategoryFilter('Libro')">📖 Libros</button>
          <button class="cat-btn" onclick="setCategoryFilter('Novela')">🌌 Novelas</button>
        </div>

        <div class="search-sort-row">
          <div class="search-field">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-input" placeholder="Buscar por título, autor o reseña...">
          </div>

          <select id="sort-select" class="sort-select">
            <option value="newest">Más recientes</option>
            <option value="rating-desc">Mejor valorados</option>
            <option value="rating-asc">Menor valoración</option>
            <option value="likes">Más populares</option>
          </select>
        </div>
      </div>

      <!-- Feed Cards Container -->
      <div id="posts-container" class="posts-feed">
        <!-- Dynamically injected -->
      </div>

    </section>

  </main>

  <footer class="footer">
    <p>🐰 <strong>CineBunny Forum</strong> &copy; 2026 — Espacio dulce & pastel para amantes del cine y la lectura.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
